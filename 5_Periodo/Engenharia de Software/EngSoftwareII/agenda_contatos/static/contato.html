<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Contatos - Sistema Tech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/estilo.css">
</head>
<body>
    <div class="container">
        <!-- MENU DE NAVEGAÇÃO -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="./contato.html">Contatos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./categoria.html">Categorias</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
        <h1>Agenda de Contatos</h1>
        
        <div class="card-container">
            <div class="card-table">
                <div class="table-header">
                    <button class="btn-action" onclick="novo()">
                        <i class="fas fa-plus"></i> Novo Contato
                    </button>
                </div>
                
                <div class="table-responsive">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Telefone</th>
                                <th>E-mail</th>
                                <th>Categoria</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="lista">
                            <!-- Dados serão preenchidos dinamicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Modal -->
        <div class="modal fade" tabindex="-1" id="modalcadastro">
            <div class="modal-dialog">
                <div class="modal-content custom-modal-bg">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="fas fa-address-book"></i> Cadastro de Contato</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="input-group">
                            <span class="input-icon"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control custom-input" id="nome" placeholder="Nome completo">
                        </div>
                        <div class="input-group">
                            <span class="input-icon"><i class="fas fa-phone"></i></span>
                            <input type="text" class="form-control custom-input" id="telefone" placeholder="Telefone">
                        </div>
                        <div class="input-group">
                            <span class="input-icon"><i class="fas fa-envelope"></i></span>
                            <input type="text" class="form-control custom-input" id="email" placeholder="E-mail">
                        </div>
                        <div class="input-group">
                            <span class="input-icon"><i class="fas fa-tag"></i></span>
                            <select class="form-control custom-input" id="id_categoria">
                                <option value="">Selecione uma categoria</option>
                                <!-- Opções serão preenchidas dinamicamente -->
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn-cancel" data-bs-dismiss="modal">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                        <button type="button" class="btn-save" onclick="salvar()">
                            <i class="fas fa-save"></i> Salvar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script/contato.js"></script>
    <script>listar()</script>
</body>
</html>
